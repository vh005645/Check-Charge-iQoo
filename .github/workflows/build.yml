name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare source
        id: src
        run: |
          ZIP=$(ls -1 CheckSac_v*.zip 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$ZIP" ]; then
            echo "Using $ZIP"
            mkdir -p src
            unzip -o "$ZIP" -d src
            echo "dir=src" >> "$GITHUB_OUTPUT"
            echo "name=${ZIP%.zip}" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "name=CheckSac" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ steps.src.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.src.outputs.name }}-apk
          path: ${{ steps.src.outputs.dir }}/app/build/outputs/apk/debug/*.apk
