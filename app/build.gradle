plugins {
    id 'com.android.application'
}

android {
    namespace 'com.checksac.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.checksac.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0-v1'
    }

    buildTypes {
        debug {
            // Debug build da duoc ky san, cai truc tiep duoc
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// Khong dung thu vien ngoai -> APK rat nhe
dependencies {
}
